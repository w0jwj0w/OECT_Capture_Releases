name: Publish verified OECT Capture v2026-2-0-0 application

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2026-2-0-0.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2026-2-0-0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIP: OECT_Capture_portable_2026.2.0.0.zip
      EXPECTED_SHA256: b29db1b7900b13fd7529cf8d556f7687e15891eedebbd30499bc4024ee65aa7c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble only the prebuilt application and verify integrity
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          parts=sorted(pathlib.Path('packages/v2026.2.0.0').glob('part*'))
          assert [p.name for p in parts]==[f'part{i:02d}' for i in range(1,13)], 'Application transfer is incomplete'
          package=pathlib.Path(os.environ['ZIP'])
          with package.open('xb') as target:
              for part in parts:
                  with part.open('rb') as source:shutil.copyfileobj(source,target)
          assert hashlib.sha256(package.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256'], 'SHA256 mismatch'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              manifest=json.loads(archive.read('OECT_Capture/OECT_Capture_2026.2.0.0/update_manifest.json'))
              assert manifest==dict(install_protocol=2,version='2026.2.0.0'), 'Installer manifest mismatch'
              assert not any('/Data_capture/' in n and not n.endswith('/') for n in archive.namelist()), 'Unexpected acquisition files'
          print('Application bytes match the locally validated portable package.')
          PY
      - name: Publish only one portable application attachment
        run: |
          set -euo pipefail
          tag=v2026.2.0.0
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Published release exists; never replace it"' "$RUNNER_TEMP/existing.json"
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # OECT Capture 2026.2.0.0
          
          Windows x64 正式便携版，配套 MCU 2026.1.0.8。
          
          - 新增默认开启的测试信息嵌入，图片显示附注，CSV、NPZ、JSON、会话配置与全程谱峰结论记录测试条件。
          - 数据菜单和启动保存设置均可开关。重复保存会更新备注或生成无附注副本。
          - 更新菜单新增本版更新日志。后续版本通过验证后直接正式发行。
          - 新目录结构为 OECT_Capture / 版本程序目录，共享 Data_capture 位于外层。v22 及更早版本首次切换请手动下载解压，随后可使用新版内置更新。
          
          85 项回归、解析器自检和 6 项冻结程序自检通过。
          
          ZIP SHA256 b29db1b7900b13fd7529cf8d556f7687e15891eedebbd30499bc4024ee65aa7c
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title 'OECT Capture 2026.2.0.0' --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$ZIP" --clobber
          gh release download "$tag" --pattern "$ZIP" --dir "$RUNNER_TEMP/downloaded"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/downloaded/$ZIP" | sha256sum --check
          gh release edit "$tag" --draft=false --prerelease=false --latest
      - name: Remove transfer pieces from the current branch after publication
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c cleanup origin/main
          git rm -r --ignore-unmatch packages/v2026.2.0.0
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove temporary application transfer pieces after release'
            git push origin HEAD:main
          fi
