name: Publish verified OECT Capture v2026-2-0-6 application

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2026-2-0-6.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2026-2-0-6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIP: OECT_Capture_portable_2026.2.0.6.zip
      EXPECTED_SHA256: 61823a12a0b7a2e6d833f29a3acfb8627567952d3f4bf7215f96141a73b410e8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble only the prebuilt application and verify integrity
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          parts=sorted(pathlib.Path('packages/v2026.2.0.6').glob('part*'))
          assert [p.name for p in parts]==[f'part{i:02d}' for i in range(1,13)], 'Application transfer is incomplete'
          package=pathlib.Path(os.environ['ZIP'])
          with package.open('xb') as target:
              for part in parts:
                  with part.open('rb') as source:shutil.copyfileobj(source,target)
          assert hashlib.sha256(package.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256'], 'SHA256 mismatch'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              manifest=json.loads(archive.read('OECT_Capture/OECT_Capture_2026.2.0.6/update_manifest.json'))
              assert manifest==dict(install_protocol=2,version='2026.2.0.6'), 'Installer manifest mismatch'
              assert not any('/Data_capture/' in n and not n.endswith('/') for n in archive.namelist()), 'Unexpected acquisition files'
          print('Application bytes match the locally validated portable package.')
          PY
      - name: Publish only one portable application attachment
        run: |
          set -euo pipefail
          tag=v2026.2.0.6
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Published release exists; never replace it"' "$RUNNER_TEMP/existing.json"
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## 2026.2.0.6（正式发行，配套 MCU 2026.1.0.8）
          
          - 在板卡版次及编号右侧新增“电解质及浓度”，所有测试模板及空白文本共用。
          - 切换模板、清空自由文本时保留该信息；随本轮测试信息、目录记录及已开启嵌入的导出图片和数据保存。
          - 电解质及浓度可留空，自行填写成分、浓度及单位，不自动推定实验条件。
          
          
          采样协议和配套 MCU 保持不变。
          
          92 项回归、解析器自检和 6 项冻结程序自检通过。
          
          ZIP SHA256 61823a12a0b7a2e6d833f29a3acfb8627567952d3f4bf7215f96141a73b410e8
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title 'OECT Capture 2026.2.0.6' --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$ZIP" --clobber
          gh release download "$tag" --pattern "$ZIP" --dir "$RUNNER_TEMP/downloaded"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/downloaded/$ZIP" | sha256sum --check
          gh release edit "$tag" --draft=false --prerelease=false --latest
      - name: Remove transfer pieces from the current branch after publication
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c cleanup origin/main
          git rm -r --ignore-unmatch packages/v2026.2.0.6
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove temporary application transfer pieces after release'
            git push origin HEAD:main
          fi
