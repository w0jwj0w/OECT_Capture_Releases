name: Publish verified OECT Capture v19 application

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v19.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v19
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIP: OECT_Capture_portable_2026.1.0.19.zip
      EXPECTED_SHA256: 6b8008a2d400971c1ff96f4d1e89da98a352cec2f30070306bc5a3b03cfcad4a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble only the prebuilt application and verify integrity
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          parts=sorted(pathlib.Path('packages/v2026.1.0.19').glob('part*'))
          assert [p.name for p in parts]==[f'part{i:02d}' for i in range(1,13)], 'Application transfer is incomplete'
          package=pathlib.Path(os.environ['ZIP'])
          with package.open('xb') as target:
              for part in parts:
                  with part.open('rb') as source:shutil.copyfileobj(source,target)
          assert hashlib.sha256(package.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256'], 'SHA256 mismatch'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              manifest=json.loads(archive.read('OECT_Capture_2026.1.0.19/update_manifest.json'))
              assert manifest==dict(install_protocol=1,version='2026.1.0.19'), 'Installer manifest mismatch'
              assert not any('/Data_capture/' in n and not n.endswith('/') for n in archive.namelist()), 'Unexpected acquisition files'
          print('Application bytes match the locally validated portable package.')
          PY
      - name: Publish only one portable application attachment
        run: |
          set -euo pipefail
          tag=v2026.1.0.19
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Published release exists; never replace it"' "$RUNNER_TEMP/existing.json"
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # OECT Capture 2026.1.0.19
          
          Windows x64 便携应用，正式发行，配套 MCU 2026.1.0.8。
          
          - 测试信息采用简短模板，新增双脉冲。填写波形参数、Vgs/Vds 偏置和板卡版次与编号。
          - 每次启动程序后，首次同意档位确认即对本次运行生效。
          - 采集模式和观察频带等设置集中到一行。拖动测试信息栏下方分隔条可调整高度，通道设置和分时局部谱峰可折叠。
          - 点击“数据 → 采集目录”中的文件链接，可用系统关联程序打开原文件。保存数据时生成的 HTML 目录也包含文件链接。
          
          75 项回归、解析器自检和 6 项冻结程序自检通过。
          
          ZIP SHA256 6b8008a2d400971c1ff96f4d1e89da98a352cec2f30070306bc5a3b03cfcad4a
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title 'OECT Capture 2026.1.0.19' --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$ZIP" --clobber
          gh release download "$tag" --pattern "$ZIP" --dir "$RUNNER_TEMP/downloaded"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/downloaded/$ZIP" | sha256sum --check
          gh release edit "$tag" --draft=false --prerelease=false --latest
      - name: Remove transfer pieces from the current branch after publication
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c cleanup origin/main
          git rm -r --ignore-unmatch packages/v2026.1.0.19
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove temporary application transfer pieces after release'
            git push origin HEAD:main
          fi
