name: Publish verified OECT Capture v22 application

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v22.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v22
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZIP: OECT_Capture_portable_2026.1.0.22.zip
      EXPECTED_SHA256: 35471f50b1ce75d0b73118749e1da3bdc1c069dfbe96d9ea797bc37457bd76f9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble only the prebuilt application and verify integrity
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          parts=sorted(pathlib.Path('packages/v2026.1.0.22').glob('part*'))
          assert [p.name for p in parts]==[f'part{i:02d}' for i in range(1,13)], 'Application transfer is incomplete'
          package=pathlib.Path(os.environ['ZIP'])
          with package.open('xb') as target:
              for part in parts:
                  with part.open('rb') as source:shutil.copyfileobj(source,target)
          assert hashlib.sha256(package.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256'], 'SHA256 mismatch'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              manifest=json.loads(archive.read('OECT_Capture_2026.1.0.22/update_manifest.json'))
              assert manifest==dict(install_protocol=1,version='2026.1.0.22'), 'Installer manifest mismatch'
              assert not any('/Data_capture/' in n and not n.endswith('/') for n in archive.namelist()), 'Unexpected acquisition files'
          print('Application bytes match the locally validated portable package.')
          PY
      - name: Publish only one portable application attachment
        run: |
          set -euo pipefail
          tag=v2026.1.0.22
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Published release exists; never replace it"' "$RUNNER_TEMP/existing.json"
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # OECT Capture 2026.1.0.22
          
          Windows x64 正式便携版，配套 MCU 2026.1.0.8。
          
          - 普通启动默认显示漏极电流和测试信息。右侧合并开始／停止按钮，统一档位移到通道标题旁，串口空闲时每 5 秒刷新。
          - 新增可关闭的启动保存设置，以及时域与频谱视图锁定。锁定时仍可读取谱峰。
          - 更新保留设置，仅迁移旧安装目录内的数据。外部数据目录沿用原路径。校验迁移文件后清理旧安装目录。
          - “更新 → 创建桌面快捷方式”添加入口。更新成功后把应用快捷方式改指新版。
          
          82 项回归、解析器自检和 6 项冻结程序自检通过。
          
          ZIP SHA256 35471f50b1ce75d0b73118749e1da3bdc1c069dfbe96d9ea797bc37457bd76f9
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title 'OECT Capture 2026.1.0.22' --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$ZIP" --clobber
          gh release download "$tag" --pattern "$ZIP" --dir "$RUNNER_TEMP/downloaded"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/downloaded/$ZIP" | sha256sum --check
          gh release edit "$tag" --draft=false --prerelease=false --latest
      - name: Remove transfer pieces from the current branch after publication
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c cleanup origin/main
          git rm -r --ignore-unmatch packages/v2026.1.0.22
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove temporary application transfer pieces after release'
            git push origin HEAD:main
          fi
