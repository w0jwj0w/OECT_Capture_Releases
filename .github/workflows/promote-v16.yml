name: Promote v16 formal Latest
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-v16.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release edit v2026.1.0.16 --draft=false --prerelease=false --latest --title 'OECT Capture 2026.1.0.16'
